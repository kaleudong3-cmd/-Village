<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>#Village</title>
<meta name="description" content="The Einherjar Village noticeboard: local announcements, a coin-changer's calculator, and a map of the village." />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20x%3D%2750%27%20y%3D%2778%27%20font-size%3D%2780%27%20text-anchor%3D%27middle%27%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bark:#3B2A1E; --bark-light:#5C4230; --bark-dark:#241609;
    --plank:#7A5738; --plank-light:#8E6A45; --plank-dark:#5E4128;
    --parchment:#EFE1BB; --parchment-dark:#DCC896; --parchment-shadow:#C7AE7C;
    --moss:#4C6B3F; --moss-light:#6C8C56; --moss-dark:#33472A;
    --ember:#DE9138; --ember-light:#F2B15C; --ember-dark:#A9601E;
    --ink:#2B1B12;
  }

  *{ box-sizing:border-box; image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bark-dark);
    font-family:'VT323', monospace;
    color:var(--ink);
    -webkit-font-smoothing:none;
  }
  .font-display{ font-family:'Press Start 2P', monospace; }

  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--ember-light);
    outline-offset:3px;
  }

  /* ---------- Pixel-stepped corners ---------- */
  .pixel-corners{
    clip-path: polygon(
      0px 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0px,
      calc(100% - 8px) 0px, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0px calc(100% - 8px)
    );
  }
  .pixel-corners-sm{
    clip-path: polygon(
      0px 4px, 2px 4px, 2px 2px, 4px 2px, 4px 0px,
      calc(100% - 4px) 0px, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px,
      100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%,
      4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0px calc(100% - 4px)
    );
  }

  .shadow-pixel{ box-shadow:4px 4px 0 0 rgba(36,22,9,0.55); }
  .shadow-pixel-sm{ box-shadow:2px 2px 0 0 rgba(36,22,9,0.55); }
  .shadow-pixel-inset{ box-shadow:inset 0 0 0 4px rgba(36,22,9,0.35); }

  /* ---------- Textures ---------- */
  .bg-wood-planks{
    background-color:var(--plank);
    background-image:
      repeating-linear-gradient(180deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 3px, transparent 3px, transparent 64px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, transparent 2px, transparent 90px, rgba(0,0,0,0.08) 92px);
  }
  .bg-bark-frame{
    background-color:var(--bark);
    background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 2px, transparent 2px, transparent 10px);
  }
  .bg-parchment-paper{
    background-color:var(--parchment);
    background-image:
      radial-gradient(rgba(199,174,124,0.5) 1px, transparent 1px),
      radial-gradient(rgba(199,174,124,0.35) 1px, transparent 1px);
    background-size:6px 6px, 9px 9px;
    background-position:0 0, 3px 4px;
  }
  .bg-grass-tiles{
    background-color:var(--moss);
    background-image: repeating-conic-gradient(rgba(0,0,0,0.06) 0% 25%, transparent 0% 50%);
    background-size:16px 16px;
  }

  .pixel-scroll::-webkit-scrollbar{ width:10px; }
  .pixel-scroll::-webkit-scrollbar-track{ background:var(--parchment-dark); }
  .pixel-scroll::-webkit-scrollbar-thumb{ background:var(--ember-dark); border:2px solid var(--plank-dark); }

  @keyframes flicker{
    0%,100%{ opacity:1; } 48%{ opacity:0.82; } 50%{ opacity:0.6; } 52%{ opacity:0.9; } 76%{ opacity:0.75; }
  }
  @keyframes sway{ 0%,100%{ transform:rotate(-1.2deg); } 50%{ transform:rotate(1.2deg); } }
  .animate-flicker{ animation:flicker 2.6s infinite ease-in-out; }
  .animate-sway{ animation:sway 4.5s infinite ease-in-out; transform-origin:top center; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- Layout ---------- */
  main{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 12px;
    position:relative;
  }
  main::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(circle at center, rgba(242,177,92,0.10), transparent 60%);
  }

  .board-wrap{ position:relative; width:100%; max-width:768px; }

  .chain{ position:absolute; top:-36px; width:4px; height:36px; background:var(--bark-dark); display:none; }
  .chain.left{ left:40px; } .chain.right{ right:40px; }

  .plaque-row{ display:flex; justify-content:center; margin-bottom:12px; }
  .plaque{ padding:8px 16px; background:var(--bark); }
  .plaque p{ margin:0; font-size:10px; letter-spacing:0.15em; color:var(--parchment); line-height:1; }

  .frame-row{ display:flex; align-items:stretch; gap:8px; }

  .nav-btn{
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; width:40px;
    background:var(--plank); color:var(--parchment);
    border:none; cursor:pointer;
    transition:background 0.15s, transform 0.1s, box-shadow 0.1s;
  }
  .nav-btn:hover{ background:var(--ember); }
  .nav-btn:active{ transform:translateY(2px); box-shadow:none; }
  .nav-btn svg{ width:24px; height:24px; }

  .frame{
    background:var(--bark);
    position:relative; flex:1; padding:8px;
  }
  .frame-bolt{ position:absolute; width:8px; height:8px; background:rgba(43,27,18,0.7); }
  .frame-bolt.tl{ top:4px; left:4px; } .frame-bolt.tr{ top:4px; right:4px; }
  .frame-bolt.bl{ bottom:4px; left:4px; } .frame-bolt.br{ bottom:4px; right:4px; }

  .plank-inner{ padding:8px; }
  .parchment-area{ min-height:420px; max-height:70vh; overflow-y:auto; padding:12px; }

  .lantern-deco{ position:absolute; top:-12px; right:12px; display:none; }
  .lantern-deco svg{ width:24px; height:24px; }

  .dots-row{ margin-top:16px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .dots-row .label{ font-size:9px; color:rgba(239,225,187,0.9); }
  .dots{ display:flex; align-items:center; gap:8px; }
  .dot{ width:10px; height:10px; border:2px solid var(--bark-dark); background:var(--parchment-dark); cursor:pointer; padding:0; }
  .dot.active{ background:var(--ember); }

  .hint{ margin-top:24px; max-width:420px; text-align:center; font-size:16px; color:rgba(239,225,187,0.6); }

  h2.slide-title{ font-size:14px; margin:0 0 16px; color:var(--ink); }
  h3.card-title{ font-size:11px; margin:0 0 8px; color:var(--ink); }

  /* ---------- Slide: Noticeboard ---------- */
  .notice-grid{ display:grid; grid-template-columns:1fr; gap:20px; }
  @media(min-width:640px){ .notice-grid{ grid-template-columns:1fr 1fr; } }
  .notice{
    position:relative; padding:12px; border:2px solid;
    transition:transform 0.15s;
    cursor:pointer;
  }
  .notice:hover{ transform:rotate(0deg) !important; }
  .notice .pin{ position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:16px; height:16px; }
  .notice p.body{ font-size:19px; line-height:1.25; margin:0 0 8px; }
  .notice p.signed{ font-size:17px; margin:0; }

  /* Paper style variants for the different "types" of flyers */
  .notice.paper-parchment{ background:var(--parchment); border-color:var(--parchment-shadow); }
  .notice.paper-parchment .card-title{ color:var(--ink); }
  .notice.paper-parchment p.body{ color:rgba(43,27,18,0.9); }
  .notice.paper-parchment p.signed{ color:rgba(43,27,18,0.6); }

  .notice.paper-scrap{ background:#D8C9A8; border-color:#9C8358; }
  .notice.paper-scrap .card-title{ color:#3A2C16; }
  .notice.paper-scrap p.body{ color:#4A3B22; }
  .notice.paper-scrap p.signed{ color:rgba(74,59,34,0.65); }

  .notice.paper-poster{ background:#E8D9B0; border:2px dashed #A9601E; }
  .notice.paper-poster .card-title{ color:#A9231C; }
  .notice.paper-poster p.body{ color:#5E3B14; }
  .notice.paper-poster p.signed{ color:rgba(94,59,20,0.65); }

  .notice.paper-slate{ background:#2E3A34; border-color:#1A211D; }
  .notice.paper-slate .card-title{ color:#EFE1BB; }
  .notice.paper-slate p.body{ color:#D7E4DC; }
  .notice.paper-slate p.signed{ color:rgba(215,228,220,0.6); }

  .ai-loading{ text-align:center; }

  /* ---------- Slide: Currency ---------- */
  .currency-intro{ font-size:19px; color:rgba(43,27,18,0.7); margin:0 0 20px; }
  .currency-grid{ display:grid; grid-template-columns:1fr; gap:16px; }
  @media(min-width:640px){ .currency-grid{ grid-template-columns:repeat(3,1fr); } }
  .currency-card{ background:var(--parchment); border:2px solid var(--parchment-shadow); padding:12px; }
  .currency-card .label-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .currency-card .label-row span{ font-size:10px; }
  .currency-card svg{ width:24px; height:24px; }
  .currency-card input{
    width:100%; font-family:'VT323', monospace; font-size:24px;
    background:var(--parchment-paper, var(--parchment)); background-color:var(--parchment);
    border:2px solid var(--bark-dark); padding:4px 8px; color:var(--ink); outline:none;
  }
  .currency-card input:focus-visible{ border-color:var(--ember); }
  .currency-card .hint{ margin:4px 0 0; text-align:left; font-size:16px; color:rgba(43,27,18,0.6); max-width:none; }
  .purse-total{ margin-top:20px; background:rgba(76,107,63,0.2); border:2px solid var(--moss); padding:12px; }
  .purse-total p{ margin:0; font-size:19px; color:var(--moss-dark); }
  .purse-total p.krw-total{ margin-top:6px; color:var(--ember-dark); }

  /* ---------- Slide: Map ---------- */
  .map-box{
    position:relative; width:100%; aspect-ratio:10/9; overflow:hidden;
    background-color:var(--moss); border:2px solid var(--moss-dark);
    touch-action:none; cursor:default;
  }
  .map-box.zoomed{ cursor:grab; }
  .map-box.zoomed.is-panning, .map-box.is-panning{ cursor:grabbing; }
  .map-canvas{
    position:absolute; inset:0; width:100%; height:100%;
    transform-origin:0 0; touch-action:none;
  }
  .map-zoom-controls{
    position:absolute; right:8px; bottom:8px; z-index:5;
    display:flex; flex-direction:column; gap:4px;
  }
  .map-zoom-btn{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    background:var(--plank); color:var(--parchment); border:2px solid var(--plank-dark);
    font-family:'Press Start 2P', monospace; cursor:pointer;
    box-shadow:2px 2px 0 0 rgba(36,22,9,0.55);
    transition:background 0.15s, transform 0.1s;
  }
  .map-zoom-btn:hover{ background:var(--ember); }
  .map-zoom-btn:active{ transform:translateY(2px); box-shadow:none; }
  .map-zoom-btn.in, .map-zoom-btn.out{ font-size:16px; }
  .map-zoom-btn.reset{ font-size:14px; }

  /* Crossroads running through the village quarter */
  .crossroad{ position:absolute; background:rgba(142,106,69,0.75); }
  .crossroad.v{ left:46%; top:20%; height:60%; width:8%; }
  .crossroad.h{ left:20%; top:46%; height:8%; width:60%; }

  /* Central plaza ring, cobbled, with the fountain at its heart */
  .plaza-ring{
    position:absolute; left:36%; top:36%; width:28%; height:28%;
    background-color:#B9AE94;
    background-image: radial-gradient(rgba(122,87,56,0.4) 1px, transparent 1px);
    background-size:5px 5px;
    border:2px solid var(--plank-dark);
  }

  /* Outer terrain: forest rings the village on every side, with farmland,
     an orchard, and the lake tucked into the corners beyond the treeline. */
  .zone{ position:absolute; }
  .zone.forest{ background:var(--moss-dark); opacity:0.55; }
  .zone.farm{
    background-color:#8E6A45;
    background-image: repeating-linear-gradient(0deg, rgba(43,27,18,0.25) 0px, rgba(43,27,18,0.25) 3px, transparent 3px, transparent 10px);
  }
  .zone.orchard{
    background-color:#6C8C56;
    background-image: repeating-radial-gradient(circle, rgba(43,27,18,0.18) 0px, rgba(43,27,18,0.18) 2px, transparent 2px, transparent 12px);
  }
  .zone.lake{ background:#4F6A82; }
  .zone.lake::after{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0px, rgba(255,255,255,0.12) 3px, transparent 3px, transparent 16px);
  }

  .decor{ position:absolute; transform:translate(-50%,-50%); pointer-events:none; }
  .decor svg{ display:block; filter:drop-shadow(1px 1px 0 rgba(36,22,9,0.4)); }
  .decor.tree svg{ width:20px; height:26px; }
  .decor.flower svg{ width:11px; height:13px; }
  @media(min-width:640px){
    .decor.tree svg{ width:26px; height:32px; }
    .decor.flower svg{ width:14px; height:16px; }
  }

  .poi-btn{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer; padding:0; z-index:2;
  }
  .poi-btn .bldg-wrap{ padding:4px; transition:transform 0.15s; }
  .poi-btn:hover .bldg-wrap, .poi-btn.active .bldg-wrap{ transform:translateY(-4px); }
  .poi-btn svg.bldg{ width:30px; height:30px; filter:drop-shadow(2px 2px 0 rgba(36,22,9,0.6)); display:block; }
  .poi-btn.icon-sm svg.bldg{ width:24px; height:24px; }
  .poi-btn.icon-lg svg.bldg{ width:38px; height:38px; }
  @media(min-width:640px){
    .poi-btn svg.bldg{ width:38px; height:38px; }
    .poi-btn.icon-sm svg.bldg{ width:30px; height:30px; }
    .poi-btn.icon-lg svg.bldg{ width:48px; height:48px; }
  }
  .poi-btn.active svg.bldg{ filter:brightness(1.15) drop-shadow(2px 2px 0 rgba(36,22,9,0.6)); }
  .poi-btn .tag{ font-size:7px; padding:2px 4px; white-space:nowrap; background:rgba(43,27,18,0.75); color:var(--parchment); }
  .poi-btn.active .tag{ background:var(--ember); color:var(--ink); }
  @media(min-width:640px){ .poi-btn .tag{ font-size:8px; } }

  /* Easter egg: coin pop from the fountain */
  .coin-pop{
    position:absolute; top:0; left:50%; width:20px; height:20px;
    transform:translate(-50%,-10%); pointer-events:none; z-index:20;
    animation:coinPop 0.9s ease-out forwards;
  }
  .coin-pop svg{ width:100%; height:100%; filter:drop-shadow(2px 2px 0 rgba(36,22,9,0.6)); }
  @keyframes coinPop{
    0%{ transform:translate(-50%,-10%) scale(0.4) rotate(0deg); opacity:0; }
    18%{ opacity:1; }
    55%{ transform:translate(-50%,-280%) scale(1.2) rotate(180deg); opacity:1; }
    100%{ transform:translate(-50%,-340%) scale(0.85) rotate(320deg); opacity:0; }
  }

  /* Easter egg: apple drop from the orchard */
  .apple-drop{
    position:absolute; top:4px; left:50%; width:15px; height:15px;
    transform:translate(-50%,0) scale(0.8) rotate(-8deg); opacity:0;
    pointer-events:none; z-index:20;
    animation:appleFall 0.9s cubic-bezier(.4,0,.2,1) forwards;
  }
  .apple-drop svg{ width:100%; height:100%; filter:drop-shadow(2px 2px 0 rgba(36,22,9,0.6)); }
  @keyframes appleFall{
    0%{ transform:translate(-50%,0) scale(0.8) rotate(-8deg); opacity:0; }
    12%{ opacity:1; }
    70%{ transform:translate(-50%,32px) scale(1) rotate(15deg); opacity:1; }
    85%{ transform:translate(-50%,28px) scale(0.95) rotate(10deg); opacity:1; }
    100%{ transform:translate(-50%,40px) scale(0.85) rotate(22deg); opacity:0; }
  }
  .poi-detail{ margin-top:16px; background:var(--parchment); border:2px solid var(--parchment-shadow); padding:12px; }
  .poi-detail p{ font-size:19px; color:rgba(43,27,18,0.8); margin:4px 0 0; }

  /* ---------- Slide: Dice ---------- */
  .dice-intro{ font-size:19px; color:rgba(43,27,18,0.7); margin:0 0 20px; }
  .dice-stage{ display:flex; flex-direction:column; align-items:center; gap:16px; margin-bottom:24px; }
  .die-face{
    width:96px; height:96px; display:flex; align-items:center; justify-content:center;
    background:var(--parchment); border:3px solid var(--bark-dark);
    box-shadow:5px 5px 0 0 rgba(36,22,9,0.55);
    transition:background 0.15s, border-color 0.15s;
  }
  .die-face .num{ font-family:'Press Start 2P', monospace; font-size:30px; color:var(--ink); }
  .die-face.rolling{ animation:diceShake 0.08s infinite; }
  @keyframes diceShake{ 0%{ transform:rotate(-3deg); } 50%{ transform:rotate(3deg); } 100%{ transform:rotate(-3deg); } }
  .die-face.tier-crit-success{ background:var(--ember-light); border-color:var(--ember-dark); }
  .die-face.tier-success{ background:#CFE0B8; border-color:var(--moss-dark); }
  .die-face.tier-normal{ background:var(--parchment-dark); border-color:var(--parchment-shadow); }
  .die-face.tier-failure{ background:#DDBFA0; border-color:#A9601E; }
  .die-face.tier-crit-failure{ background:#D79A93; border-color:#7A1F1F; }
  .roll-btn{
    font-family:'Press Start 2P', monospace; font-size:11px; cursor:pointer;
    padding:12px 22px; background:var(--ember); color:var(--ink);
    border:2px solid var(--bark-dark); box-shadow:3px 3px 0 0 rgba(36,22,9,0.55);
    transition:transform 0.1s, box-shadow 0.1s;
  }
  .roll-btn:hover{ background:var(--ember-light); }
  .roll-btn:active{ transform:translate(3px,3px); box-shadow:none; }
  .roll-result{ min-height:26px; text-align:center; }
  .roll-result p{ margin:0; font-size:19px; color:rgba(43,27,18,0.85); }
  .roll-result .tier-name{ font-family:'Press Start 2P', monospace; font-size:11px; }
  .tier-legend{ display:grid; grid-template-columns:1fr; gap:10px; }
  @media(min-width:640px){ .tier-legend{ grid-template-columns:1fr 1fr; } }
  .tier-card{
    background:var(--parchment); border:2px solid var(--parchment-shadow); padding:10px 12px;
    display:flex; align-items:flex-start; gap:10px; transition:border-color 0.2s, transform 0.2s;
  }
  .tier-card .chip{
    flex-shrink:0; width:14px; height:14px; margin-top:2px; border:2px solid var(--bark-dark);
  }
  .tier-card .chip.tier-crit-success{ background:var(--ember); }
  .tier-card .chip.tier-success{ background:var(--moss-light); }
  .tier-card .chip.tier-normal{ background:var(--parchment-shadow); }
  .tier-card .chip.tier-failure{ background:#A9601E; }
  .tier-card .chip.tier-crit-failure{ background:#7A1F1F; }
  .tier-card h4{ margin:0 0 2px; font-size:11px; font-family:'Press Start 2P', monospace; color:var(--ink); }
  .tier-card .range{ font-size:15px; color:rgba(43,27,18,0.55); margin:0 0 4px; }
  .tier-card p.desc{ margin:0; font-size:17px; line-height:1.3; color:rgba(43,27,18,0.85); }
  .tier-card.highlight{ border-color:var(--ember-dark); transform:translateY(-2px); box-shadow:3px 3px 0 0 rgba(36,22,9,0.35); }

  @media(min-width:640px){
    .chain{ display:block; }
    .lantern-deco{ display:block; }
    .nav-btn{ width:56px; }
    .nav-btn svg{ width:32px; height:32px; }
    .frame-row{ gap:16px; }
    .parchment-area{ padding:24px; min-height:460px; }
    .plaque p{ font-size:12px; }
    h2.slide-title{ font-size:16px; }
    .dots-row .label{ font-size:10px; }
  }

  /* ---------- Mobile fine-tuning ---------- */
  @media(max-width:479px){
    main{ padding:24px 8px; }
    .plaque{ padding:6px 10px; }
    .plaque p{ font-size:8px; }
    .nav-btn{ width:36px; }
    .nav-btn svg{ width:20px; height:20px; }
    .frame-row{ gap:6px; }
    .plank-inner{ padding:6px; }
    .parchment-area{ padding:10px; min-height:360px; max-height:65vh; }

  function numberToKoreanWon(num){
    if(num <= 0) return "0";
    var units = [ {value:100000000, label:"억"}, {value:10000, label:"만"} ];
    var remain = num;
    var parts = [];
    units.forEach(function(u){
      if(remain >= u.value){
        var count = Math.floor(remain / u.value);
        parts.push(count.toLocaleString("ko-KR") + u.label);
        remain = remain % u.value;
      }
    });
    if(remain > 0 || parts.length === 0){
      parts.push(remain.toLocaleString("ko-KR"));
    }
    return parts.join(" ");
  }

  function formatKrw(copperAmount){
    var krw = Math.round((copperAmount / COPPER_PER_GOLD) * KRW_PER_GOLD);
    return numberToKoreanWon(krw);
  }

    var inputs = { gold: document.getElementById("cur-gold"), silver: document.getElementById("cur-silver"), copper: document.getElementById("cur-copper") };
    var totalEl = document.querySelector(".purse-total p");
    var krwEl = document.querySelector(".purse-total p.krw-total");

    function toCopper(tier, v){
      if(tier === "gold") return v * COPPER_PER_GOLD;
      if(tier === "silver") return v * COPPER_PER_SILVER;
      return v;
    }
    function fromCopper(tier, c){
      if(tier === "gold") return c / COPPER_PER_GOLD;
      if(tier === "silver") return c / COPPER_PER_SILVER;
      return c;
    }

    Object.keys(inputs).forEach(function(tier){
      inputs[tier].addEventListener("input", function(e){
        var raw = e.target.value;

          totalCopper = 0;

        var numeric = Number(raw);
        if(isNaN(numeric)) return;
        var clamped = Math.max(0, numeric);
        totalCopper = toCopper(tier, clamped);

        Object.keys(inputs).forEach(function(t){
          if(t !== tier) inputs[t].value = formatAmount(fromCopper(t, totalCopper));

  function playCoinChime(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      var now = ctx.currentTime;
      [[880, 0], [1318.5, 0.09]].forEach(function(pair){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = pair[0];
        gain.gain.setValueAtTime(0, now + pair[1]);
        gain.gain.linearRampToValueAtTime(0.28, now + pair[1] + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + pair[1] + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + pair[1]);
        osc.stop(now + pair[1] + 0.4);
      });
      setTimeout(function(){ ctx.close(); }, 600);
    }catch(e){}
  }

  /* ----- Map pinch/scroll zoom & pan ----- */
  var mapScale = 1, mapTx = 0, mapTy = 0;
  var MAP_MIN_SCALE = 1, MAP_MAX_SCALE = 3;
  var MAP_MOBILE_BREAKPOINT = 640, MAP_MOBILE_SCALE = 1.4;
  var mapInitialized = false;
  var mapPointers = {};
  var mapPinchStartDist = null, mapPinchStartScale = 1;
  var mapIsPanning = false, mapPanStart = null, mapDragMoved = false;
  var mapMouseDown = false, mapMouseStart = null;

  function mapClamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

  function mapApplyTransform(){
    var canvas = document.getElementById("mapCanvas");
    if(canvas) canvas.style.transform = "translate("+mapTx+"px,"+mapTy+"px) scale("+mapScale+")";
  }

  function mapClampPan(box){
    var w = box.clientWidth, h = box.clientHeight;
    mapTx = mapClamp(mapTx, w - w*mapScale, 0);
    mapTy = mapClamp(mapTy, h - h*mapScale, 0);
  }

  function mapSetScale(newScale, originX, originY, box){
    newScale = mapClamp(newScale, MAP_MIN_SCALE, MAP_MAX_SCALE);
    var rect = box.getBoundingClientRect();
    if(originX === undefined) originX = rect.width / 2;
    if(originY === undefined) originY = rect.height / 2;
    var mapX = (originX - mapTx) / mapScale;
    var mapY = (originY - mapTy) / mapScale;
    mapScale = newScale;
    mapTx = originX - mapX * mapScale;
    mapTy = originY - mapY * mapScale;
    mapClampPan(box);
    mapApplyTransform();
    box.classList.toggle("zoomed", mapScale > 1.001);
  }

  /* Icons keep their fixed % positions on the map; only the camera's
     starting zoom/pan differs so small screens don't load with every
     marker crowded together. */
  function mapDefaultScale(){
    return (window.innerWidth < MAP_MOBILE_BREAKPOINT) ? MAP_MOBILE_SCALE : 1;
  }

  function mapGoToDefaultView(box){
    mapScale = mapDefaultScale();
    var w = box.clientWidth, h = box.clientHeight;
    mapTx = (w - w * mapScale) / 2;
    mapTy = (h - h * mapScale) / 2;
    mapApplyTransform();
    box.classList.toggle("zoomed", mapScale > 1.001);
  }

  function mapResetZoom(box){
    mapGoToDefaultView(box);
  }

  function wireMap(){
    var mapBox = document.getElementById("mapBox");
    var mapCanvas = document.getElementById("mapCanvas");

    var buttons = document.querySelectorAll(".poi-btn");
    buttons.forEach(function(btn){
      btn.addEventListener("click", function(){
        if(mapDragMoved) return;
        var poiId = btn.getAttribute("data-poi");
        var triggeredEgg = null;
        if(poiId === "fountain" || poiId === "orchard"){
          if(registerEggClick(poiId)) triggeredEgg = poiId;
          EGG_POIS.forEach(function(id){ if(id !== poiId) resetEggClick(id); });
        } else {
          EGG_POIS.forEach(resetEggClick);
        }
        activePoiId = poiId;
        renderSlide(activeIndex, true);
        if(triggeredEgg === "fountain"){
          playCoinChime();
          spawnCoinPop(document.querySelector('.poi-btn[data-poi="fountain"]'));
        } else if(triggeredEgg === "orchard"){
          spawnAppleDrop(document.querySelector('.poi-btn[data-poi="orchard"]'));
        }
      });
    });

    if(!mapBox || !mapCanvas) return;

    if(!mapInitialized){
      mapInitialized = true;
      mapGoToDefaultView(mapBox);
    }
    mapClampPan(mapBox);
    mapApplyTransform();
    mapBox.classList.toggle("zoomed", mapScale > 1.001);

    /* Desktop: scroll wheel zooms the map, centered on the cursor */
    mapBox.addEventListener("wheel", function(e){
      e.preventDefault();
      var rect = mapBox.getBoundingClientRect();
      var originX = e.clientX - rect.left;
      var originY = e.clientY - rect.top;
      var factor = e.deltaY < 0 ? 1.15 : 1/1.15;
      mapSetScale(mapScale * factor, originX, originY, mapBox);
    }, { passive:false });

    /* Mobile: two-finger pinch zooms, one-finger drag pans once zoomed */
    mapBox.addEventListener("touchstart", function(e){
      Array.prototype.forEach.call(e.changedTouches, function(t){
        mapPointers[t.identifier] = { x:t.clientX, y:t.clientY };
      });
      var ids = Object.keys(mapPointers);
      if(ids.length === 2){
        var p1 = mapPointers[ids[0]], p2 = mapPointers[ids[1]];
        mapPinchStartDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
        mapPinchStartScale = mapScale;
        mapIsPanning = false;
        mapDragMoved = true;
      } else if(ids.length === 1){
        mapIsPanning = true;
        mapDragMoved = false;
        var t = mapPointers[ids[0]];
        mapPanStart = { x:t.x, y:t.y, tx:mapTx, ty:mapTy };
      }
    }, { passive:true });

    mapBox.addEventListener("touchmove", function(e){
      Array.prototype.forEach.call(e.changedTouches, function(t){
        if(mapPointers[t.identifier]) mapPointers[t.identifier] = { x:t.clientX, y:t.clientY };
      });
      var ids = Object.keys(mapPointers);
      var rect = mapBox.getBoundingClientRect();
      if(ids.length === 2 && mapPinchStartDist){
        e.preventDefault();
        var p1 = mapPointers[ids[0]], p2 = mapPointers[ids[1]];
        var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
        var midX = (p1.x + p2.x) / 2 - rect.left;
        var midY = (p1.y + p2.y) / 2 - rect.top;
        mapSetScale(mapPinchStartScale * (dist / mapPinchStartDist), midX, midY, mapBox);
      } else if(ids.length === 1 && mapIsPanning && mapPanStart){
        var t = mapPointers[ids[0]];
        var dx = t.x - mapPanStart.x, dy = t.y - mapPanStart.y;
        if(Math.abs(dx) > 6 || Math.abs(dy) > 6) mapDragMoved = true;
        if(mapDragMoved){
          e.preventDefault();
          mapTx = mapPanStart.tx + dx;
          mapTy = mapPanStart.ty + dy;
          mapClampPan(mapBox);
          mapApplyTransform();
        }
      }
    }, { passive:false });

    function endMapTouch(e){
      if(mapDragMoved) e.preventDefault();
      Array.prototype.forEach.call(e.changedTouches, function(t){ delete mapPointers[t.identifier]; });
      var ids = Object.keys(mapPointers);
      if(ids.length < 2) mapPinchStartDist = null;
      if(ids.length === 0){
        mapIsPanning = false;
        mapPanStart = null;
        setTimeout(function(){ mapDragMoved = false; }, 0);
      } else if(ids.length === 1){
        mapIsPanning = true;
        var t = mapPointers[ids[0]];
        mapPanStart = { x:t.x, y:t.y, tx:mapTx, ty:mapTy };
      }
    }
    mapBox.addEventListener("touchend", endMapTouch, { passive:false });
    mapBox.addEventListener("touchcancel", endMapTouch, { passive:false });

    /* Desktop: click-and-drag pans once zoomed */
    mapBox.addEventListener("mousedown", function(e){
      mapMouseDown = true;
      mapDragMoved = false;
      mapMouseStart = { x:e.clientX, y:e.clientY, tx:mapTx, ty:mapTy };
    });

    var zoomInBtn = document.getElementById("mapZoomIn");
    var zoomOutBtn = document.getElementById("mapZoomOut");
    var zoomResetBtn = document.getElementById("mapZoomReset");
    if(zoomInBtn) zoomInBtn.addEventListener("click", function(){ mapSetScale(mapScale * 1.3, undefined, undefined, mapBox); });
    if(zoomOutBtn) zoomOutBtn.addEventListener("click", function(){ mapSetScale(mapScale / 1.3, undefined, undefined, mapBox); });
    if(zoomResetBtn) zoomResetBtn.addEventListener("click", function(){ mapResetZoom(mapBox); });
  }

    }
    loginSubmitBtn.disabled = true;
    try{
      var res = await sb.auth.signInWithPassword({ email:email, password:password });
      if(res.error) throw res.error;
      isAdmin = true;
      updateAdminToggle();
      closeLoginModal();
      if(SLIDES[activeIndex].id === "notices") renderSlide(activeIndex, true);
    }catch(e){
      console.error("로그인 실패:", e);
      loginError.textContent = "이메일 또는 비밀번호가 올바르지 않습니다.";
      loginError.hidden = false;
    }finally{
      loginSubmitBtn.disabled = false;
    }
  }
  loginSubmitBtn.addEventListener("click", attemptLogin);
  adminPassInput.addEventListener("keydown", function(e){ if(e.key === "Enter") attemptLogin(); });
  adminEmailInput.addEventListener("keydown", function(e){ if(e.key === "Enter") attemptLogin(); });

  function openNoticeModal(id){
    editingId = id;
    noticeError.hidden = true;
    if(id === null){
      noticeModalTitle.textContent = "공지 추가";
      noticeTitleInput.value = "";
      noticeSignedInput.value = "";
      noticeBodyInput.value = "";
    } else {
      var n = NOTICES.find(function(x){ return x.id === id; });
      if(!n) return;
      noticeModalTitle.textContent = "공지 수정";
      noticeTitleInput.value = n.title;
      noticeSignedInput.value = n.signed;
      noticeBodyInput.value = n.body;
    }
    noticeModal.hidden = false;
    noticeTitleInput.focus();
  }
  function closeNoticeModal(){ noticeModal.hidden = true; }

  noticeCancelBtn.addEventListener("click", closeNoticeModal);
  noticeModal.addEventListener("click", function(e){ if(e.target === noticeModal) closeNoticeModal(); });

  noticeSaveBtn.addEventListener("click", async function(){
    var title = noticeTitleInput.value.trim();
    var signed = noticeSignedInput.value.trim();
    var body = noticeBodyInput.value.trim();
    if(!title || !signed || !body){
      noticeError.hidden = false;
      return;
    }
    var signedFormatted = signed.indexOf("—") === 0 || signed.indexOf("-") === 0 ? signed : "— " + signed;
    noticeSaveBtn.disabled = true;
    try{
      if(editingId === null){
        var tilt = Number((Math.random() * 4 - 2).toFixed(1));
        var insertRes = await sb.from("notices")
          .insert({ title:title, body:body, signed:signedFormatted, tilt:tilt })
          .select().single();
        if(insertRes.error) throw insertRes.error;
        NOTICES.push(insertRes.data);
      } else {
        var updateRes = await sb.from("notices")
          .update({ title:title, body:body, signed:signedFormatted })
          .eq("id", editingId).select().single();
        if(updateRes.error) throw updateRes.error;
        var idx = NOTICES.findIndex(function(x){ return x.id === editingId; });
        if(idx !== -1) NOTICES[idx] = updateRes.data;
      }
      closeNoticeModal();
      renderSlide(activeIndex, true);
    }catch(e){
      console.error("공지 저장 실패:", e);
      noticeError.textContent = "저장에 실패했어요. 잠시 후 다시 시도해주세요.";
      noticeError.hidden = false;
    }finally{
      noticeSaveBtn.disabled = false;
    }
  });

  var deleteModal = document.getElementById("deleteModal");
  var deleteMessage = document.getElementById("deleteMessage");
  var deleteConfirmBtn = document.getElementById("deleteConfirmBtn");
  var deleteCancelBtn = document.getElementById("deleteCancelBtn");
  var pendingDeleteId = null;

  function openDeleteModal(id){
    pendingDeleteId = id;
    var n = NOTICES.find(function(x){ return x.id === id; });
    if(!n) return;
    deleteMessage.textContent = '"' + n.title + '" 공지를 정말 삭제할까요? 이 작업은 되돌릴 수 없습니다.';
    deleteModal.hidden = false;
    deleteConfirmBtn.focus();
  }
  function closeDeleteModal(){
    deleteModal.hidden = true;
    pendingDeleteId = null;
  }

  deleteCancelBtn.addEventListener("click", closeDeleteModal);
  deleteModal.addEventListener("click", function(e){ if(e.target === deleteModal) closeDeleteModal(); });
  deleteConfirmBtn.addEventListener("click", async function(){
    if(pendingDeleteId === null) return;
    var idToDelete = pendingDeleteId;
    deleteConfirmBtn.disabled = true;
    try{
      var delRes = await sb.from("notices").delete().eq("id", idToDelete);
      if(delRes.error) throw delRes.error;
      NOTICES = NOTICES.filter(function(x){ return x.id !== idToDelete; });
      closeDeleteModal();
      renderSlide(activeIndex, true);
    }catch(e){
      console.error("공지 삭제 실패:", e);
      closeDeleteModal();
      alert("삭제에 실패했어요. 잠시 후 다시 시도해주세요.");
    }finally{
      deleteConfirmBtn.disabled = false;
    }
  });

  var viewModal = document.getElementById("viewModal");
  var viewModalBox = document.getElementById("viewModalBox");
  var viewModalContent = document.getElementById("viewModalContent");
  var viewModalClose = document.getElementById("viewModalClose");

  function openViewModal(key){
    var idx = NOTICES.findIndex(function(x){ return x.id === key; });
    var n = NOTICES[idx];
    if(!n) return;
    var st = noticeStyleFor(idx);
    viewModalBox.className = "view-modal-box notice pixel-corners shadow-pixel paper-"+st.paper;
    var html = "";
    html += pinSvg(st.pin) +
      '<h3 class="card-title font-display">'+escapeHtml(n.title)+'</h3>' +
      '<p class="body">'+escapeHtml(n.body)+'</p>' +
      '<p class="signed">'+escapeHtml(n.signed)+'</p>';
    viewModalContent.innerHTML = html;
    viewModal.hidden = false;
    viewModalClose.focus();
  }
  function closeViewModal(){ viewModal.hidden = true; }

  viewModalClose.addEventListener("click", closeViewModal);
  viewModal.addEventListener("click", function(e){ if(e.target === viewModal) closeViewModal(); });

  /* ---------------- Carousel ---------------- */
  var SLIDES = [
    { id:"notices", label:"Noticeboard", render:renderNoticeboard, wire:wireNoticeboard },
    { id:"currency", label:"Coin-Changer", render:renderCurrency, wire:wireCurrencyInputs },
    { id:"map", label:"Village Map", render:renderMap, wire:wireMap },
    { id:"dice", label:"운명의 주사위", render:renderDice, wire:wireDice }
  ];
  var activeIndex = 0;

  var host = document.getElementById("slideHost");
  var label = document.getElementById("slideLabel");
  var dotsHost = document.getElementById("dots");

  function renderDots(){
    dotsHost.innerHTML = "";
    SLIDES.forEach(function(s, i){
      var dot = document.createElement("button");
      dot.type = "button";
      dot.className = "dot" + (i === activeIndex ? " active" : "");
      dot.setAttribute("aria-label", "Go to " + s.label);
      dot.setAttribute("aria-current", i === activeIndex ? "true" : "false");
      dot.addEventListener("click", function(){ setActive(i); });
      dotsHost.appendChild(dot);
    });
  }

  function renderSlide(index, skipScrollReset){
    var slide = SLIDES[index];
    host.innerHTML = slide.render();
    label.textContent = slide.label;
    if(slide.wire) slide.wire();
    renderDots();
    if(!skipScrollReset) host.scrollTop = 0;
  }

  function setActive(index){
    activeIndex = (index + SLIDES.length) % SLIDES.length;
    renderSlide(activeIndex);
  }

  document.getElementById("prevBtn").addEventListener("click", function(){ setActive(activeIndex - 1); });
  document.getElementById("nextBtn").addEventListener("click", function(){ setActive(activeIndex + 1); });
  window.addEventListener("keydown", function(e){
    if(!loginModal.hidden || !noticeModal.hidden || !deleteModal.hidden || !viewModal.hidden){
      if(e.key === "Escape"){ closeLoginModal(); closeNoticeModal(); closeDeleteModal(); closeViewModal(); }
      return;
    }
    if(e.key === "ArrowLeft") setActive(activeIndex - 1);
    if(e.key === "ArrowRight") setActive(activeIndex + 1);
  });

  /* Global map drag/resize handlers — registered once, always look up the
     current #mapBox since the map slide's DOM gets rebuilt on re-render. */
  window.addEventListener("mousemove", function(e){
    if(!mapMouseDown) return;
    var mapBox = document.getElementById("mapBox");
    if(!mapBox){ mapMouseDown = false; return; }
    var dx = e.clientX - mapMouseStart.x, dy = e.clientY - mapMouseStart.y;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) mapDragMoved = true;
    if(mapDragMoved){
      mapTx = mapMouseStart.tx + dx;
      mapTy = mapMouseStart.ty + dy;
      mapClampPan(mapBox);
      mapApplyTransform();
      mapBox.classList.add("is-panning");
    }
  });
  window.addEventListener("mouseup", function(){
    if(!mapMouseDown) return;
    mapMouseDown = false;
    var mapBox = document.getElementById("mapBox");
    if(mapBox) mapBox.classList.remove("is-panning");
    setTimeout(function(){ mapDragMoved = false; }, 0);
  });
  window.addEventListener("resize", function(){
    var mapBox = document.getElementById("mapBox");
    if(!mapBox) return;
    mapClampPan(mapBox);
    mapApplyTransform();
  });

  renderSlide(activeIndex);

  loadNotices();

  /* Restore admin session if already logged in (e.g. after page refresh) */
  sb.auth.getSession().then(function(res){
    if(res.data && res.data.session){
      isAdmin = true;
      updateAdminToggle();
      if(SLIDES[activeIndex].id === "notices") renderSlide(activeIndex, true);
    }
  });
  sb.auth.onAuthStateChange(function(event, session){
    var nowAdmin = !!session;
    if(nowAdmin !== isAdmin){
      isAdmin = nowAdmin;
      updateAdminToggle();
      if(SLIDES[activeIndex].id === "notices") renderSlide(activeIndex, true);
    }
  });
})();
</script>
</body>
</html>
